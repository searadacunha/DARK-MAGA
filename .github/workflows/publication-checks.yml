name: Publication checks

on:
  pull_request:
    branches: [main, audit-2026-11-03]
  push:
    branches: [main, audit-2026-11-03]

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLICATION_TARGET: ${{ github.base_ref || github.ref_name }}
      # A push must be checked against its previous destination, not approve itself.
      PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the candidate with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check target history, README and frozen files
        run: python scripts/check_publication.py --target "$PUBLICATION_TARGET" --target-ref "$PUBLICATION_BASE"
      - name: Test the publication guard using temporary Git repositories
        run: python -m unittest discover -s tests -p test_publication_guard.py -v
      - name: Install the existing audit test dependencies
        if: env.PUBLICATION_TARGET == 'audit-2026-11-03'
        run: python -m pip install -r requirements-test.txt
      - name: Run the existing offline audit suite, including both protocol locks
        if: env.PUBLICATION_TARGET == 'audit-2026-11-03'
        env:
          DMAGA_EXT: ${{ runner.temp }}/dark-maga-offline
        run: python scripts/guard.py -- python -m pytest tests -q --ignore=tests/test_publication_guard.py
