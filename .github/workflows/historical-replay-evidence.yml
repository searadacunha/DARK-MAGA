name: Historical replay evidence checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'investigations/2026-11-06_historical_replay/**'
      - 'docs/TIMELINE.md'
      - '.github/workflows/historical-replay-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'investigations/2026-11-06_historical_replay/**'
      - 'docs/TIMELINE.md'
      - '.github/workflows/historical-replay-evidence.yml'

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout research evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Recompute receipts, provenance and claim assertions
        run: python -I -m unittest discover -s investigations/2026-11-06_historical_replay/tests -p 'test_*.py' -v
