name: deBridge evidence checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'investigations/2026-11-05_debridge_winners/**'
      - 'investigations/2026-11-13_debridge_bsc_delivery/**'
      - '.github/workflows/debridge-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'investigations/2026-11-05_debridge_winners/**'
      - 'investigations/2026-11-13_debridge_bsc_delivery/**'
      - '.github/workflows/debridge-evidence.yml'

permissions:
  contents: read

jobs:
  archived-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate the table against pinned archived evidence
        run: python investigations/2026-11-05_debridge_winners/validate.py
      - name: Run deBridge regression tests
        run: python -m unittest discover -s investigations/2026-11-05_debridge_winners -p 'test_*.py' -v
      - name: Verify BSC delivery against archived receipts
        run: python -m unittest discover -s investigations/2026-11-13_debridge_bsc_delivery/tests -p 'test_*.py' -v
