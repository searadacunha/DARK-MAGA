    <path d="M-47 3H-3M15 3H53" stroke="#caffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M-47 3L-160 8M52 3L173-18" stroke="url(#beam)" stroke-width="8" filter="url(#small)"/>
