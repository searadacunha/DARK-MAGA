<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Dark MAGA — Did Musk Know?</title>
  <desc id="desc">A stylized investigation cover showing the July 14, 2024 DMAGA token launch, the July 21 documented Elon Musk avatar change, and an abstract network of traced blockchain transactions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c18"/>
      <stop offset=".58" stop-color="#13102a"/>
      <stop offset="1" stop-color="#070f20"/>
    </linearGradient>
    <radialGradient id="redGlow">
      <stop offset="0" stop-color="#c42545" stop-opacity=".38"/>
      <stop offset="1" stop-color="#c42545" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#16baff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#16baff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f6ff" stop-opacity="1"/>
      <stop offset=".55" stop-color="#29c5ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#29c5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4a70"/>
      <stop offset="1" stop-color="#bd2658"/>
    </linearGradient>
    <pattern id="grid" width="39" height="39" patternUnits="userSpaceOnUse">
      <path d="M39 0H0V39" fill="none" stroke="#c6d5ff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="small"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1200" height="430" fill="url(#bg)"/>
  <rect width="1200" height="430" fill="url(#grid)"/>
  <ellipse cx="830" cy="191" rx="350" ry="320" fill="url(#redGlow)"/>
  <ellipse cx="1050" cy="265" rx="290" ry="220" fill="url(#blueGlow)"/>
  <path d="M0 0H1200" stroke="#f34766" stroke-width="6"/>
  <path d="M0 429H1200" stroke="#28324f" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="42" width="210" height="29" rx="14.5" fill="#221c33" stroke="#944050" stroke-opacity=".7"/>
    <circle cx="73" cy="56.5" r="4.5" fill="#ff4d72"/>
    <text x="86" y="61.5" fill="#f3cad5" font-size="12" font-weight="700" letter-spacing="2">ON-CHAIN INVESTIGATION</text>
    <text x="53" y="164" fill="#f7f8fe" font-size="73" font-weight="800" letter-spacing="-2">DARK MAGA</text>
    <text x="56" y="220" fill="#ff5379" font-size="44" font-weight="800" letter-spacing="-1">DID MUSK KNOW?</text>
    <text x="58" y="267" fill="#b9bed2" font-size="19" letter-spacing=".5">Seven days before the avatar change.</text>
    <text x="58" y="297" fill="#b9bed2" font-size="19" letter-spacing=".5">Follow the wallets. Trace the funds.</text>
    <path d="M57 336H645" stroke="#44445b" stroke-width="1"/>
    <circle cx="69" cy="365" r="5" fill="#f84a6c"/>
    <text x="84" y="370" fill="#e8eaf6" font-size="14" font-weight="700">14 JUL 2024</text>
    <text x="84" y="390" fill="#98a0bb" font-size="12">DMAGA launched</text>
    <path d="M260 365H369" stroke="#51516e" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="382" cy="365" r="5" fill="#38c9ff"/>
    <text x="397" y="370" fill="#e8eaf6" font-size="14" font-weight="700">21 JUL 2024</text>
    <text x="397" y="390" fill="#98a0bb" font-size="12">Avatar change documented</text>
  </g>
  <g transform="translate(890 210)">
