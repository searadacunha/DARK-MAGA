name: EVM deep-trace self-check

on:
  pull_request:
    branches: [main]
    paths:
      - 'investigations/2026-11-05_evm-recipient-deeptrace/**'
      - '.github/workflows/evm-deeptrace.yml'
  push:
    branches: [main]
    paths:
      - 'investigations/2026-11-05_evm-recipient-deeptrace/**'
      - '.github/workflows/evm-deeptrace.yml'

permissions:
  contents: read

jobs:
  offline-selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Offline self-check (network blocked, frozen receipts)
        run: cd investigations/2026-11-05_evm-recipient-deeptrace/scripts && python -I s99_selfcheck.py
