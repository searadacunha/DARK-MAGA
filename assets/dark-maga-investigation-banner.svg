    <circle r="134" fill="none" stroke="#ec426d" stroke-opacity=".32" stroke-width="1" stroke-dasharray="6 10"/>
    <path d="M-78 96Q-92 25-72-43Q-58-91-18-106Q39-119 81-58Q110-7 73 92" fill="#2b142b" stroke="#bf355b" stroke-opacity=".55" stroke-width="2"/>
