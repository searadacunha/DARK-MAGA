name: Forensic pipeline regression checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'dmaga/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/forensic-pipeline-tests.yml'
  push:
    branches: [main]
    paths:
      - 'dmaga/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/forensic-pipeline-tests.yml'

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DMAGA_EXT: /tmp/dark-maga-offline
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install "duckdb>=1.2,<2" "pyarrow>=18,<24" "pytest>=8,<10" "numpy>=1.26,<3"
      - name: Check normalization, cost basis and duplicate trades
        run: python -m pytest -q tests/test_normalize.py tests/test_pnl.py tests/test_db_dedup.py tests/test_x_provenance.py tests/test_pass2_historical_x.py
